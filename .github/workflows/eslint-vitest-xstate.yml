name: ESLint, Vitest, and XState Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  initialize-comments:
    name: Initialize PR Review Comments
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Initialize Ordered PR Review Comments
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          retries: 3
          script: |
            const reviewComments = [
              {
                header: '### 🧹 ESLint',
                body: '### 🧹 ESLint\n\n**Quality check 1 of 3**\n\n⏳ Waiting for ESLint.',
              },
              {
                header: '### 🧪 Vitest',
                body: '### 🧪 Vitest\n\n**Quality check 2 of 3**\n\n⏳ Waiting for Vitest.',
              },
              {
                header: '### 🎭 Playwright',
                body: '### 🎭 Playwright\n\n**Quality check 3 of 3**\n\n⏳ Waiting for a successful preview deployment.',
              },
              {
                header: '### 🗺️ XState v5 State Machine Diff Visualization',
                body: '<!-- xstate-v5-change-map -->\n### 🗺️ XState v5 State Machine Diff Visualization\n\n**Architecture visualization**\n\n⏳ Waiting for static XState analysis.',
              },
            ];

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            for (const reviewComment of reviewComments) {
              const existingComment = comments.find(
                comment => comment.user.type === 'Bot' && comment.body?.includes(reviewComment.header),
              );

              if (!existingComment) {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: reviewComment.body,
                });
              }
            }
  lint:
    name: Lint & Annotate PR
    needs: initialize-comments
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COVERAGE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install Dependencies
        id: install
        run: pnpm install

      - name: Run Lint and Capture Output
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set +e
          pnpm lint 2>&1 | tee "$RUNNER_TEMP/lint-output.txt"
          LINT_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ "$LINT_EXIT_CODE" -eq 0 ] || grep -Eq '[0-9]+ problems? \([0-9]+ errors?, [0-9]+ warnings?\)' "$RUNNER_TEMP/lint-output.txt"; then
            LINT_RUNNER_STATUS=complete
          else
            LINT_RUNNER_STATUS=failed
          fi

          echo "LINT_EXIT_CODE=$LINT_EXIT_CODE" >> "$GITHUB_ENV"
          echo "LINT_RUNNER_STATUS=$LINT_RUNNER_STATUS" >> "$GITHUB_ENV"
          echo "LINT_OUTPUT_FILE=$RUNNER_TEMP/lint-output.txt" >> "$GITHUB_ENV"

      - name: Post Lint PR Comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          retries: 3
          script: |
            const fs = require('fs');
            const outputPath = process.env.LINT_OUTPUT_FILE;
            const output = outputPath && fs.existsSync(outputPath)
              ? fs.readFileSync(outputPath, 'utf8').trim()
              : '';
            const exitCode = Number.parseInt(process.env.LINT_EXIT_CODE ?? '', 10);
            const runnerStatus = process.env.LINT_RUNNER_STATUS;
            const header = '### 🧹 ESLint';
            const qualityPosition = '**Quality check 1 of 3**';
            const hasFindings = /\d+ problems? \(\d+ errors?, \d+ warnings?\)/.test(output);
            const displayedOutput = output.length > 58000
              ? `…\n${output.slice(-58000)}`
              : output;
            let body;

            if (!Number.isInteger(exitCode) || runnerStatus !== 'complete') {
              body = `${header}\n\n${qualityPosition}\n\n❌ **ESLint could not run.**${displayedOutput ? `\n\n\`\`\`text\n${displayedOutput}\n\`\`\`` : ''}`;
            } else if (exitCode === 0 && !hasFindings) {
              body = `${header}\n\n${qualityPosition}\n\n✅ **Zero warnings.**`;
            } else {
              body = `${header}\n\n${qualityPosition}\n\n⚠️ **ESLint completed with advisory findings.**\n\n\`\`\`text\n${displayedOutput}\n\`\`\``;
            }

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const botComment = comments.find(
              comment => comment.user.type === 'Bot' && comment.body?.includes(header),
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      - name: Run Vitest and Capture Summary
        id: vitest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set +e
          pnpm vitest run --coverage --passWithNoTests 2>&1 | tee "$RUNNER_TEMP/vitest-output.txt"
          VITEST_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "VITEST_EXIT_CODE=$VITEST_EXIT_CODE" >> "$GITHUB_ENV"
          echo "VITEST_OUTPUT_FILE=$RUNNER_TEMP/vitest-output.txt" >> "$GITHUB_ENV"
          exit "$VITEST_EXIT_CODE"

      - name: Post Vitest PR Comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          retries: 3
          script: |
            const fs = require('fs');
            const outputPath = process.env.VITEST_OUTPUT_FILE;
            const output = outputPath && fs.existsSync(outputPath)
              ? fs.readFileSync(outputPath, 'utf8')
              : '';
            const cleanOutput = output.replace(/\u001b\[[0-9;]*m/g, '');
            const exitCode = Number.parseInt(process.env.VITEST_EXIT_CODE ?? '', 10);
            const header = '### 🧪 Vitest';
            const qualityPosition = '**Quality check 2 of 3**';
            const summaryLines = cleanOutput
              .split(/\r?\n/)
              .filter(line => /Test Files|Tests|Duration|No test files found/.test(line))
              .slice(-8);
            const fallbackLines = cleanOutput
              .split(/\r?\n/)
              .filter(Boolean)
              .slice(-12);
            const summary = (summaryLines.length > 0 ? summaryLines : fallbackLines).join('\n');
            const status = Number.isInteger(exitCode) && exitCode === 0
              ? '✅ **Vitest completed successfully.**'
              : '❌ **Vitest tests failed or the runner could not complete.**';
            const body = `${header}\n\n${qualityPosition}\n\n${status}${summary ? `\n\n\`\`\`text\n${summary}\n\`\`\`` : ''}`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const botComment = comments.find(
              comment => comment.user.type === 'Bot' && comment.body?.includes(header),
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      - name: Run Blocking XState Analyzer Tests
        id: xstate-tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set +e
          pnpm test:xstate-diff 2>&1 | tee "$RUNNER_TEMP/xstate-tests-output.txt"
          XSTATE_TESTS_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "XSTATE_TESTS_EXIT_CODE=$XSTATE_TESTS_EXIT_CODE" >> "$GITHUB_ENV"
          exit "$XSTATE_TESTS_EXIT_CODE"

      - name: Inspect Coverage Evidence
        id: coverage-evidence
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const checkoutSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            const contributors = [
              { name: 'vitest', reports: ['lcov.info', 'coverage-final.json', 'index.html'], exitCode: process.env.VITEST_EXIT_CODE },
              { name: 'xstate', reports: ['lcov.info', 'coverage-summary.json'], exitCode: process.env.XSTATE_TESTS_EXIT_CODE },
            ];

            core.summary.addHeading('Coverage evidence');
            core.summary.addRaw(`Checkout: ${checkoutSha}\n\nCodecov attribution: ${process.env.COVERAGE_COMMIT_SHA}\n\n`);

            for (const contributor of contributors) {
              const directory = `coverage/${contributor.name}`;
              try {
                const missingReports = contributor.reports.filter(
                  report => !fs.existsSync(`${directory}/${report}`) || fs.statSync(`${directory}/${report}`).size === 0,
                );
                const lcov = missingReports.includes('lcov.info') ? '' : fs.readFileSync(`${directory}/lcov.info`, 'utf8');
                const sources = [...lcov.matchAll(/^SF:(.+)$/gm)].map(match => match[1].trim().replace(/\\/g, '/'));
                const unmappedSources = sources.filter(source => !source.startsWith('src/') || !fs.existsSync(source));
                const hasMappedCoverage = sources.length > 0 && unmappedSources.length === 0;
                core.setOutput(contributor.name, hasMappedCoverage);
                core.summary.addRaw(`- ${contributor.name}: runner exit ${contributor.exitCode ?? 'unavailable'}; ${sources.length} source files; missing reports: ${missingReports.join(', ') || 'none'}; unmapped sources: ${unmappedSources.length}.\n`);
                if (missingReports.length > 0 || !hasMappedCoverage) {
                  core.warning(`${contributor.name} coverage evidence is unavailable or incomplete. Preserve available artifacts; do not interpret missing evidence as zero coverage.`);
                }
              } catch (error) {
                core.setOutput(contributor.name, false);
                core.warning(`${contributor.name} coverage evidence could not be read: ${error.message}`);
                core.summary.addRaw(`- ${contributor.name}: coverage evidence unavailable.\n`);
              }
            }

            core.summary.addRaw('\nReports from failed or interrupted runs may be partial. Missing evidence is not zero coverage or a complete baseline.\n');
            await core.summary.write();

      - name: Upload Vitest Evidence
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-evidence
          path: |
            coverage/vitest/
            coverage/xstate/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Application Coverage to Codecov
        if: ${{ !cancelled() && steps.coverage-evidence.outputs.vitest == 'true' }}
        timeout-minutes: 3
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/vitest/lcov.info
          disable_search: true
          flags: vitest
          override_commit: ${{ env.COVERAGE_COMMIT_SHA }}

      - name: Upload XState Tooling Coverage to Codecov
        if: ${{ !cancelled() && steps.coverage-evidence.outputs.xstate == 'true' }}
        timeout-minutes: 3
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/xstate/lcov.info
          disable_search: true
          flags: vitest-xstate
          override_commit: ${{ env.COVERAGE_COMMIT_SHA }}

      - name: Enforce Test and Tooling Results
        if: ${{ !cancelled() }}
        run: |
          FAILED=0

          if ! [[ "$LINT_EXIT_CODE" =~ ^[0-9]+$ ]] || [ "$LINT_RUNNER_STATUS" != "complete" ]; then
            echo "ESLint could not run."
            FAILED=1
          fi

          if ! [[ "$VITEST_EXIT_CODE" =~ ^[0-9]+$ ]] || [ "$VITEST_EXIT_CODE" -ne 0 ]; then
            echo "Vitest tests failed or the runner could not complete."
            FAILED=1
          fi

          if ! [[ "$XSTATE_TESTS_EXIT_CODE" =~ ^[0-9]+$ ]] || [ "$XSTATE_TESTS_EXIT_CODE" -ne 0 ]; then
            echo "XState analyzer tests failed or the runner could not complete."
            FAILED=1
          fi

          exit "$FAILED"

  xstate-analysis:
    name: Analyze XState v5 Topology
    needs: initialize-comments
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Pull Request History
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install Analysis Dependencies Without Lifecycle Scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Static XState v5 Diff
        id: xstate-analysis
        continue-on-error: true
        run: pnpm xstate:diff
        env:
          XSTATE_DIFF_ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          XSTATE_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          XSTATE_DIFF_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          XSTATE_DIFF_OUTPUT_DIRECTORY: xstate-diff-artifacts

      - name: Upload XState Diff Artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xstate-v5-state-machine-diff
          path: xstate-diff-artifacts/
          if-no-files-found: warn
          retention-days: 14

  xstate-publish:
    name: Publish XState v5 Diff Visualization
    needs:
      - initialize-comments
      - xstate-analysis
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download XState Diff Artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xstate-v5-state-machine-diff
          path: xstate-diff-artifacts

      - name: Publish Stable XState Diff Comment
        continue-on-error: true
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          retries: 3
          script: |
            const fs = require('fs');
            const marker = '<!-- xstate-v5-change-map -->';
            const header = '### 🗺️ XState v5 State Machine Diff Visualization';
            const commentPath = 'xstate-diff-artifacts/comment.md';
            const maximumCommentBytes = 60_000;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const fallbackBody = `${marker}\n${header}\n\n**Architecture visualization**\n\n⚠️ **Static XState analysis is unavailable.**\n\n[Inspect workflow run](${runUrl})`;
            let body = fallbackBody;

            if (fs.existsSync(commentPath)) {
              const candidateBody = fs.readFileSync(commentPath, 'utf8').trim();
              const isValid =
                Buffer.byteLength(candidateBody, 'utf8') <= maximumCommentBytes &&
                candidateBody.startsWith(marker) &&
                candidateBody.includes(header);

              if (isValid) {
                body = candidateBody;
              } else {
                core.warning('Rejected an invalid or oversized XState diff comment artifact.');
              }
            }

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const botComment = comments.find(
              comment => comment.user.type === 'Bot' && comment.body?.includes(marker),
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
